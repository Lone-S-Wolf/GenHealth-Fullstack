<!-- Top statement banner -->
<div class="landing-font w-full bg-gradient-to-r from-emerald-800 via-emerald-700 to-emerald-400 text-white">
    <div class="max-w-7xl mx-auto px-4 py-2 text-center xl:text-xl font-semibold tracking-wide">
        "SHOWING CARE SAVING LIVES" - GENHEALTH MULTISPECIALTY HOSPITAL
    </div>
</div>

<!-- Nav -->
<header class="landing-font w-full bg-white/75 shadow-sm sticky top-0 z-100">
    <div class="mx-auto px-4 lg:px-8">
        <nav class="flex items-center justify-between gap-6 h-20">

            <!-- Logo -->
            <div class="flex-shrink-0">
                <a href="#" class="flex items-center">
                    <img src="./icons/Genhealth-logo-dark.png" class="h-14 w-auto object-contain px-0" />
                    <span class="bg-gradient-to-r from-emerald-800 via-emerald-700 via-emerald-600 
                       via-emerald-500 to-emerald-400 bg-clip-text text-transparent 
                       relative -left-4 text-4xl font-bold px-0">
                        ENHEALTH
                    </span>
                </a>
            </div>

            <!-- Desktop Nav -->
            <div class="flex-1 flex justify-center xl:mr-40">
                <ul class="hidden lg:flex items-center gap-8 text-emerald-700 font-medium">
                    <li><a href="#about-section" class="hover:text-emerald-900 hover:underline">About Us</a></li>
                    <li><a href="#services-section" class="hover:text-emerald-900 hover:underline">Services</a></li>
                    <li><a href="#" class="hover:text-emerald-900 hover:underline">Testimonials</a>
                    </li>
                    <li><a routerLink="/doctors" class="hover:text-emerald-900 hover:underline">View Doctors</a></li>
                    <li><a routerLink="/contact-us" class="hover:text-emerald-900 hover:underline">Contact</a></li>
                </ul>
            </div>

            <!-- Login + Hamburger -->
            <div class="flex items-center gap-3 flex-shrink-0">

                <button routerLink="/login" class="btn-login text-xl">Login</button>

                <!-- Hamburger -->
                <button type="button" class="lg:hidden p-2 text-emerald-800 hover:bg-emerald-50 rounded-md"
                    (click)="toggleMenu()">

                    @if (!isMenuOpen) {
                    <!-- Hamburger icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                    } @else {
                    <!-- Close icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                    }
                </button>
            </div>
        </nav>
    </div>

    <!-- POPUP MOBILE MENU OVERLAY -->
    @if (isMenuOpen) {

    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black/20 z-99" (click)="closeMenu()">
    </div>

    <!-- Popup panel -->
    <div
        class="fixed top-30 right-4 w-64 bg-white rounded-xl shadow-2xl z-100 p-4 border border-emerald-100 animate-fade-in">

        <ul class="flex flex-col gap-3 text-emerald-700 font-medium">
            <li><a routerLink="/about" (click)="closeMenu()"
                    class="block px-2 py-2 rounded-md hover:bg-emerald-50">About Us</a></li>
            <li><a routerLink="/services" (click)="closeMenu()"
                    class="block px-2 py-2 rounded-md hover:bg-emerald-50">Services</a></li>
            <li><a routerLink="/testimonials" (click)="closeMenu()"
                    class="block px-2 py-2 rounded-md hover:bg-emerald-50">Testimonials</a></li>
            <li><a routerLink="/doctors" (click)="closeMenu()"
                    class="block px-2 py-2 rounded-md hover:bg-emerald-50">View Doctors</a></li>
            <li><a routerLink="/contact-us" (click)="closeMenu()"
                    class="block px-2 py-2 rounded-md hover:bg-emerald-50">Contact</a></li>
        </ul>
    </div>
    }

</header>

<main>
    <router-outlet></router-outlet>
</main>
