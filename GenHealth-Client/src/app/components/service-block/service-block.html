@if (layout === 'text-left') {
<!-- Text left, image right -->
<div class="grid gap-4 md:grid-cols-[minmax(0,2fr)_minmax(0,1.4fr)] items-stretch mt-10">
    <!-- Text card -->
    <article class="rounded-2xl p-6">
        <h3 class="mb-3 text-3xl font-semibold text-white">
            {{ title }}
        </h3>

        <div class="space-y-10 text-2xl leading-relaxed text-white pt-10">
            @for (paragraph of body; track $index) {
            <p>{{ paragraph }}</p>
            }
        </div>
    </article>

    <!-- Image -->
    <div class="rounded-2xl overflow-hidden">
        <img class="h-full w-full object-cover" [src]="imageUrl" [alt]="imageAlt || title" loading="lazy" />
    </div>
</div>
} @else {
<!-- Image left, text right -->
<div class="grid gap-4 md:grid-cols-[minmax(0,1.4fr)_minmax(0,2fr)] items-stretch mt-10">
    <!-- Image -->
    <div class="rounded-2xl overflow-hidden">
        <img class="h-full w-full object-cover" [src]="imageUrl" [alt]="imageAlt || title" loading="lazy" />
    </div>

    <!-- Text card -->
    <article class="rounded-2xl p-6">
        <h3 class="mb-3 text-3xl font-semibold text-white">
            {{ title }}
        </h3>

        <div class="space-y-10 pt-10 text-2xl leading-relaxed text-white">
            @for (paragraph of body; track $index) {
            <p>{{ paragraph }}</p>
            }
        </div>
    </article>
</div>
}
