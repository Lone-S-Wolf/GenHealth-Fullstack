<section class="max-w-[1570px] mx-auto px-4 py-30">
    @if (!section) {
    <div class="flex h-40 items-center justify-center rounded-xl bg-slate-50 text-sm text-slate-500">
        Loading top doctors...
    </div>
    } @else if (section.doctors.length === 0) {
    <div class="flex h-40 items-center justify-center rounded-xl bg-slate-50 text-sm text-slate-500">
        No doctors to display.
    </div>
    } @else {
    <!-- Heading -->
    <header class="mb-6 flex flex-col gap-1 sm:flex-row sm:items-baseline sm:justify-between">
        <div>
            <h2 class="text-8xl font-bold tracking-[0.2em] text-white">
                {{ section.heading }}
            </h2>
            @if (section.subtitle) {
            <p class="mt-2 text-xl text-white">
                {{ section.subtitle }}
            </p>
            }
        </div>
        <a class="cursor-pointer text-white hover:underline text-xl">View all Doctors <strong>→</strong></a>
    </header>

    <!-- Cards grid -->
    <div class="grid gap-6 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
        @for (doc of section.doctors; track trackDoctor($index, doc)) {
        <app-doctor-card [doctor]="doc"></app-doctor-card>
        }
    </div>
    }
</section>
